version: '3'

vars:
  ENV: feathers3
  # Everything clang-format owns. lib/vqf is vendored upstream -- left alone.
  SOURCES: src/*.cpp src/*.h include/*.h tools/*/*.cpp test/*/*.cpp

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list
    silent: true

  init:
    desc: "First-time setup: check tools, fetch toolchains and libraries"
    cmds:
      - |
        missing=0
        for tool in pio clang-format; do
          command -v $tool >/dev/null || { echo "MISSING: $tool"; missing=1; }
        done
        if [ $missing = 1 ]; then
          echo "Install with: pip install platformio && brew install clang-format"
          exit 1
        fi
      - |
        if [ -f src/secrets.h ]; then
          echo "src/secrets.h exists"
        else
          cp src/secrets.example.h src/secrets.h
          echo "Created src/secrets.h -- set WIFI_SSID/WIFI_PASS to use your"
          echo "own network, or leave them empty for access-point mode."
        fi
      - pio pkg install -e {{.ENV}}
      - pio pkg install -e native
      - echo "Ready. Next{{":"}} task ci"

  build:
    desc: "Compile the firmware"
    cmds:
      - pio run -e {{.ENV}}

  flash:
    desc: "Build, flash, then open the serial monitor (Ctrl+C to exit)"
    cmds:
      - pkill -f "pio device monitor" || true
      - pio run -e {{.ENV}} -t upload
      - pio device monitor -e {{.ENV}}

  upload:
    desc: "Build and flash without opening the monitor"
    cmds:
      - pkill -f "pio device monitor" || true
      - pio run -e {{.ENV}} -t upload

  monitor:
    desc: "Open the serial monitor only (no reflash)"
    cmds:
      - pio device monitor -e {{.ENV}}

  scan:
    desc: "Flash the I2C/LED bring-up probe -- use when a STEMMA cable is suspect"
    cmds:
      - pkill -f "pio device monitor" || true
      - pio run -e i2cscan -t upload
      - pio device monitor -e i2cscan

  test:
    desc: "Unit tests on this machine (nav filter, geo, telemetry) -- no board needed"
    cmds:
      - pio test -e native

  coverage:
    desc: "Host unit tests with coverage (needs gcovr; gates 95% lines / 90% branches)"
    cmds:
      - rm -rf .pio/coverage .pio/build/native_cov
      - mkdir -p .pio/coverage
      - pio test -e native_cov
      # Only our own code: not the vendored VQF, the tests themselves, or PlatformIO's Unity.
      - >-
        gcovr --root . --object-directory .pio/build/native_cov
        --filter 'src/' --filter 'include/'
        --exclude 'src/generated/'
        --txt .pio/coverage/summary.txt --xml .pio/coverage/coverage.xml
        --html-details .pio/coverage/index.html --print-summary
        --fail-under-line 95 --fail-under-branch 90
      # The README badge is rendered from the report this just wrote.
      - python3 scripts/coverage_badge.py

  test-ui:
    desc: "Run the dashboard's JavaScript headlessly against a real telemetry frame"
    cmds:
      # The frame comes from the firmware's own encoder, so this checks the
      # firmware and the dashboard still agree on the schema.
      - mkdir -p .pio/uicheck
      # One run, both message types: the telemetry frame and the spectrum
      # frame are two halves of the same contract and must not drift apart.
      - pio test -e native -f test_telemetry -vv > .pio/uicheck/encoder.log
      - grep -m1 '^FRAME:' .pio/uicheck/encoder.log | sed 's/^FRAME://' > .pio/uicheck/frame.json
      - grep -m1 '^SPECTRUM:' .pio/uicheck/encoder.log | sed 's/^SPECTRUM://' > .pio/uicheck/spectrum.json
      - node tools/check_dashboard.mjs .pio/uicheck/frame.json .pio/uicheck/spectrum.json

  lint:
    desc: "Static analysis (cppcheck) -- fails on HIGH or MEDIUM findings"
    cmds:
      - pio check -e {{.ENV}} --skip-packages --fail-on-defect high --fail-on-defect medium

  format:
    desc: "Format all sources with clang-format"
    cmds:
      - clang-format -i {{.SOURCES}}

  format-check:
    desc: "Fail if any source is not clang-formatted"
    cmds:
      - clang-format --dry-run --Werror {{.SOURCES}}

  ci:
    desc: "Everything CI runs: format-check, lint, test, build"
    cmds:
      - task: format-check
      - task: lint
      - task: test
      - task: test-ui
      - task: build

  clean:
    desc: "Remove build artifacts"
    cmds:
      - pio run -e {{.ENV}} -t clean

  erase:
    desc: "Erase all flash, including saved settings"
    cmds:
      - pio run -e {{.ENV}} -t erase
