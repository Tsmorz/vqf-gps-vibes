; VQF + GPS sensor fusion on an Unexpected Maker FeatherS3 (ESP32-S3).
; Build/flash via the Taskfile: `task build`, `task flash`, `task scan`, `task test`.

[platformio]
default_envs = feathers3

; ── Settings shared by the two on-board environments ─────────────────────────
; Kept out of [env] so the native test environment does not inherit a board.
[esp32]
platform = espressif32
board = um_feathers3
framework = arduino
monitor_speed = 115200
; Turns a panic backtrace of raw addresses into file:line.
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; VQF defaults to double precision. The S3's FPU is single-precision only,
    ; so doubles would be software-emulated; this keeps the 200 Hz update well
    ; inside its time budget.
    -D VQF_SINGLE_PRECISION

; ── Main firmware ────────────────────────────────────────────────────────────
[env:feathers3]
extends = esp32
build_src_filter = +<*> -<generated/>
; The board definition pins the Arduino loop and the WiFi event task to core 1.
; Move both to core 0 so core 1 belongs entirely to the estimator task, which
; is what keeps the 200 Hz tick free of jitter from web traffic.
build_unflags =
    ${esp32.build_unflags}
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    ${esp32.build_flags}
    -I src            ; lets config.h reach src/generated/version.h
    -D ARDUINO_RUNNING_CORE=0
    -D ARDUINO_EVENT_RUNNING_CORE=0
lib_deps =
    adafruit/Adafruit LSM6DS@^4.7.4
    adafruit/Adafruit LIS3MDL@^1.2.4
    adafruit/Adafruit GPS Library@^1.7.5
    adafruit/Adafruit NeoPixel@^1.12.5
    links2004/WebSockets@^2.6.1
extra_scripts =
    pre:scripts/embed_web.py   ; web/index.html -> src/generated/web_index.h
    pre:scripts/version.py     ; git describe   -> src/generated/version.h
check_tool = cppcheck
check_src_filters =
    +<src/>
    +<include/>
check_flags =
    cppcheck: --suppress=unusedFunction
             --suppress=missingOverride
             --suppress=noExplicitConstructor
             --suppress=unusedStructMember
             --suppress=*:*/generated/*

; ── I2C/LED bring-up probe ───────────────────────────────────────────────────
; Standalone diagnostic: scans both I2C buses and cycles the onboard RGB LED.
; Run it when a STEMMA cable is suspect -- `task scan`.
[env:i2cscan]
extends = esp32
build_src_filter = -<*> +<../tools/i2cscan/>
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.5

; ── Unit tests on this machine (no board needed) -- `task test` ──────────────
; Only the pure-math headers (nav_filter.h, geo.h) are exercised; everything
; that touches Arduino APIs is excluded by build_src_filter.
[env:native]
platform = native
test_framework = unity
; telemetry.cpp is pure formatting with no Arduino dependency, so the frame
; encoder is tested against the same code the firmware ships. Everything else
; in src/ touches Arduino APIs and is excluded.
test_build_src = yes
build_src_filter = -<*> +<telemetry.cpp>
build_flags =
    -std=c++17
    -I include
    -I src
